name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src\spcsign -c Release

      - name: Publish (single file)
        run: dotnet publish src\spcsign -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spcsign-win-x64
          path: artifacts/spcsign.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/spcsign.exe
